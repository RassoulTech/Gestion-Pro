<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Télécharger le Logo GestionPro</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    button { background: #ea580c; color: white; border: none; padding: 16px 32px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(234, 88, 12, 0.2); }
    button:hover { background: #c2410c; transform: scale(1.05); }
    canvas { display: none; }
    .preview { width: 800px; height: 200px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 8px; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <h1>Votre En-tête Google Forms est prêt !</h1>
  <p>Voici l'aperçu de la bannière (1600x400) :</p>
  
  <div class="preview" id="svg-container">
    <svg id="mySvg" width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
      <rect width="1600" height="400" fill="#f8fafc" />
      <g transform="translate(800, 200)">
        <g transform="translate(-250, -64)">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
              <stop offset="0" stopColor="#EA580C" />
              <stop offset="1" stopColor="#7C2D12" />
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="24" ry="24" fill="url(#brandGrad)" />
          <text x="64" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" fill="#ffffff" letter-spacing="-4">G</text>
        </g>
        <text x="-80" y="32" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="#18181b" letter-spacing="-4">
          Gestion<tspan fill="#ea580c">Pro</tspan>
        </text>
      </g>
    </svg>
  </div>

  <button onclick="downloadPNG()">Télécharger l'image PNG</button>
  <p style="color: #64748b; font-size: 14px; margin-top: 20px;">Cliquez pour enregistrer l'image, puis importez-la sur Google Forms.</p>

  <canvas id="canvas" width="1600" height="400"></canvas>

  <script>
    function downloadPNG() {
      const svg = document.getElementById('mySvg');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const data = new XMLSerializer().serializeToString(svg);
      const DOMURL = window.URL || window.webkitURL || window;
      
      const img = new Image();
      const svgBlob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
      const url = DOMURL.createObjectURL(svgBlob);
      
      img.onload = function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, 1600, 400);
        DOMURL.revokeObjectURL(url);
        
        const imgURI = canvas.toDataURL('image/png').replace('image/png', 'image/octet-stream');
        const evt = new MouseEvent('click', { view: window, bubbles: false, cancelable: true });
        const a = document.createElement('a');
        a.setAttribute('download', 'En-Tete-GestionPro.png');
        a.setAttribute('href', imgURI);
        a.setAttribute('target', '_blank');
        a.dispatchEvent(evt);
      };
      img.src = url;
    }
  </script>
</body>
</html>
