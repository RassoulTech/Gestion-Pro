<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond légèrement grisé pour faire ressortir le logo -->
  <rect width="1600" height="400" fill="#f8fafc" />

  <!-- Groupe centré -->
  <g transform="translate(800, 200)">
    
    <!-- Icône G (Gradient Orange) -->
    <g transform="translate(-250, -64)">
      <defs>
        <linearGradient id="brandGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
          <stop offset="0" stopColor="#EA580C" />
          <stop offset="1" stopColor="#7C2D12" />
        </linearGradient>
      </defs>
      <rect width="128" height="128" rx="24" ry="24" fill="url(#brandGrad)" />
      <text x="64" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" fill="#ffffff" letter-spacing="-4">
        G
      </text>
    </g>

    <!-- Texte GestionPro -->
    <text x="-80" y="32" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="#18181b" letter-spacing="-4">
      Gestion<tspan fill="#ea580c">Pro</tspan>
    </text>

  </g>
</svg>
